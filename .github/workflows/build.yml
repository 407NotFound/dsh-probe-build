name: b
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jadx
        run: |
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version
      - name: decompile
        run: |
          cp classes.dex.b64 classes.dex
          file classes.dex
          jadx/bin/jadx -d out --show-bad-code classes.dex > jadx.log 2>&1 || true
          find out -name '*.java' | wc -l
      - name: report
        run: |
          {
            echo "=== files ==="
            find out -name '*.java' | sed 's|out/||' | sort | head -60
            echo
            echo "=== crypto ==="
            grep -rn -E "GCMParameterSpec|SecretKeySpec|IvParameterSpec|Cipher|doFinal|payload|decrypt|Base64" out --include=*.java | head -60
            echo
            echo "=== assets/native ==="
            grep -rn -E "assets|payload|loadLibrary|native |getAssets" out --include=*.java | head -40
            echo
            echo "=== skinvpn ==="
            sed -n '1,120p' out/sources/local/skinchanger/SkinVpnService.java 2>/dev/null
            echo
            echo "=== nativebridge ==="
            sed -n '1,60p' out/sources/local/skinchanger/NativeBridge.java 2>/dev/null
          } > report.txt
          wc -c report.txt
      - name: publish
        run: |
          rm -f classes.dex
          git config user.name b; git config user.email b@b
          git add report.txt; git commit -m "report" || true
          git push
