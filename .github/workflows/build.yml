name: b
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jadx || true
          if ! command -v jadx >/dev/null; then
            curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
            unzip -q jadx.zip -d jadx && sudo ln -sf $PWD/jadx/bin/jadx /usr/local/bin/jadx
          fi
          jadx --version
      - name: decode
        run: base64 -d classes.dex.b64 > classes.dex && ls -l classes.dex
      - name: decompile
        run: |
          mkdir -p out
          jadx -d out --show-bad-code classes.dex > jadx.log 2>&1 || true
          find out -name "*.java" | wc -l
      - name: report
        run: |
          {
            echo "=== files ==="
            find out -name "*.java" | sed 's|out/||' | sort
            echo
            echo "=== crypto hits ==="
            grep -rn -E "GCMParameterSpec|SecretKeySpec|IvParameterSpec|Cipher\.getInstance|doFinal|payload|decrypt|Base64" out --include=*.java | head -80
            echo
            echo "=== asset / native ==="
            grep -rn -E "assets|payload\.bin|loadLibrary|native |getAssets" out --include=*.java | head -60
          } > report.txt
          wc -l report.txt
      - name: publish
        run: |
          rm -f classes.dex
          git config user.name b; git config user.email b@b
          git add report.txt; git commit -m "report" || true
          git push
