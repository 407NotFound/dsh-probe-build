name: b
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
      - name: build
        run: |
          set -x
          clang -target arm64-apple-ios14.0 -dynamiclib -nostdlib -fblocks -O2 \
                -Wl,-arch,arm64 -Wl,-platform_version,ios,14.0,14.0 \
                -Wl,-install_name,@rpath/Probe.dylib -Wl,-undefined,dynamic_lookup \
                -fuse-ld=/usr/bin/ld64.lld \
                -o Probe.dylib probe_min.c
          ls -l Probe.dylib
          file Probe.dylib
      - name: publish
        run: |
          base64 -w0 Probe.dylib > Probe.dylib.b64
          git config user.name b; git config user.email b@b
          git add Probe.dylib Probe.dylib.b64
          git commit -m "build $(date -u +%H%M%S)" || true
          git push
