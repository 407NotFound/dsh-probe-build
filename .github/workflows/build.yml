name: b
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
      - name: build both
        run: |
          set -x
          for n in probe_min probe_empty; do
            clang -target arm64-apple-ios14.0 -dynamiclib -nostdlib -fblocks -O2 \
                  -Wl,-arch,arm64 -Wl,-platform_version,ios,14.0,14.0 \
                  -Wl,-install_name,@rpath/${n}.dylib -Wl,-undefined,dynamic_lookup \
                  -fuse-ld=/usr/bin/ld64.lld -o ${n}.dylib ${n}.c
            ls -l ${n}.dylib
          done
      - name: publish
        run: |
          base64 -w0 probe_min.dylib > Probe.dylib.b64
          base64 -w0 probe_empty.dylib > ProbeEmpty.dylib.b64
          git config user.name b; git config user.email b@b
          git add -A; git commit -m "build $(date -u +%H%M%S)" || true
          git push
